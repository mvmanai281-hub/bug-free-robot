    <title>bug-free-robot</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #16324f; background: #f3f6fb; }

      main { max-width: 42rem; margin: 2rem; padding: 3rem; border-radius: 1.5rem; background: white; box-shadow: 0 1rem 4rem #16324f12; }

      h1 { font-size: clamp(2rem, 6vw, 3rem); overflow-wrap: anywhere; }
      p { line-height: 1.8; }
      a { color: #0759a5; }
      code { padding: .2rem .4rem; border-radius: .3rem; background: #f3f6fb; }
    </style>
  </head>
  <body>
    <main>
      <span class="label">HELLO, WORLD</span>
      <h1>bug-free-robot</h1>
      <p>欢迎！这是你的项目起点。</p>
      <p>你可以从这里开始，逐步实现自己的想法。</p>
